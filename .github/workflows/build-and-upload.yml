name: Build and Upload to Play Console

on:
  push:
    branches:
      - release/koji-flavors-v0.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Koji Pro (Entreprise) APK
        run: |
          cd mobile
          flutter build apk --flavor entreprise -t lib/main_entreprise.dart -v

      - name: Build Koji Pro (Entreprise) AAB
        run: |
          cd mobile
          flutter build appbundle --flavor entreprise -t lib/main_entreprise.dart -v

      - name: Build Koji (Client) APK
        run: |
          cd mobile
          flutter build apk --flavor client -t lib/main_client.dart -v

      - name: Build Koji (Client) AAB
        run: |
          cd mobile
          flutter build appbundle --flavor client -t lib/main_client.dart -v

      - name: Upload Koji Pro to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PRO }}
          packageName: com.koji.pro
          releaseFiles: mobile/build/app/outputs/bundle/entrepriseRelease/app-entreprise-release.aab
          track: internal
          status: draft

      - name: Upload Koji Client to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_CLIENT }}
          packageName: com.koji.client
          releaseFiles: mobile/build/app/outputs/bundle/clientRelease/app-client-release.aab
          track: internal
          status: draft

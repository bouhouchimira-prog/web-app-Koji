# Checks the Flutter app in mobile/ (Koji + Koji Pro).
# - Every push / PR touching mobile/: analysis + unit/widget tests (Linux, cheap).
# - PRs and manual runs: the real app on an Android emulator, once per app
#   (integration_test/app_smoke_test.dart).
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY            required for the emulator tests
#   TEST_PRO_EMAIL, TEST_PRO_PASSWORD          optional: a real Koji Pro test account
#   TEST_CLIENT_EMAIL, TEST_CLIENT_PASSWORD    optional: a real Koji (particulier) test account
name: Mobile – analyse et tests

on:
  push:
    paths:
      - 'mobile/**'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      integration:
        description: "Lancer aussi les tests d'intégration sur émulateur Android"
        type: boolean
        default: true

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  analyze-and-test:
    name: Analyse + tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyse (erreurs et warnings bloquants, infos tolérées)
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires et widgets
        run: flutter test

  integration-android:
    name: Intégration Android (${{ matrix.app }})
    needs: analyze-and-test
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.integration)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [client, entreprise]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Activer KVM (émulateur rapide)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Variables de test (dart-define)
        env:
          APP: ${{ matrix.app }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_PRO_EMAIL: ${{ secrets.TEST_PRO_EMAIL }}
          TEST_PRO_PASSWORD: ${{ secrets.TEST_PRO_PASSWORD }}
          TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
          TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY manquants (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "$APP" = client ]; then EMAIL="$TEST_CLIENT_EMAIL"; PASSWORD="$TEST_CLIENT_PASSWORD"
          else EMAIL="$TEST_PRO_EMAIL"; PASSWORD="$TEST_PRO_PASSWORD"; fi
          jq -n --arg u "$SUPABASE_URL" --arg k "$SUPABASE_ANON_KEY" --arg e "$EMAIL" --arg p "$PASSWORD" \
            '{SUPABASE_URL: $u, SUPABASE_ANON_KEY: $k, KOJI_TEST_EMAIL: $e, KOJI_TEST_PASSWORD: $p}' \
            > "$RUNNER_TEMP/test-defines.json"

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      # Must exist before `flutter test`: otherwise Flutter resolves the app id
      # from the manifest namespace (com.koji.pro) instead of the flavor's
      # applicationId, and for the client app it never finds the app's logs.
      - name: Pré-compiler l'APK de test
        working-directory: mobile
        run: >
          flutter build apk --debug --flavor ${{ matrix.app }}
          -t integration_test/app_smoke_test.dart
          --dart-define=KOJI_APP=${{ matrix.app }}
          --dart-define-from-file=$RUNNER_TEMP/test-defines.json

      - name: App réelle sur émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: mobile
          # -g grants runtime permissions up front: Koji Pro asks for
          # notifications at launch, and nobody answers that system dialog in CI
          # (flutter test's own install keeps the grant).
          script: |
            adb install -r -g build/app/outputs/flutter-apk/app-${{ matrix.app }}-debug.apk
            flutter test integration_test/app_smoke_test.dart --flavor ${{ matrix.app }} --dart-define=KOJI_APP=${{ matrix.app }} --dart-define-from-file=$RUNNER_TEMP/test-defines.json

# Builds the iOS apps from mobile/ and sends them to TestFlight.
# Manual only (Actions → "iOS → TestFlight" → Run workflow): macOS minutes are
# billed 10x on private repos.
#
#   client     → Koji      (com.koji.client, scheme "client",     lib/main_client.dart)
#   entreprise → Koji Pro  (com.koji.pro,    scheme "entreprise", lib/main_entreprise.dart)
#
# Secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                   10-character Team ID (developer.apple.com → Membership)
#   IOS_DIST_CERT_P12_BASE64        "Apple Distribution" certificate + private key, .p12, base64
#   IOS_DIST_CERT_PASSWORD          password of that .p12
#   IOS_PROFILE_CLIENT_BASE64       App Store provisioning profile for com.koji.client, base64
#   IOS_PROFILE_ENTREPRISE_BASE64   App Store provisioning profile for com.koji.pro, base64
#   ASC_KEY_ID, ASC_ISSUER_ID       App Store Connect API key (Users and Access → Integrations)
#   ASC_KEY_P8_BASE64               the AuthKey_XXXX.p8 file, base64
#   SUPABASE_URL, SUPABASE_ANON_KEY compiled into the app (it refuses to start without them)
#   TEST_PRO_EMAIL / TEST_PRO_PASSWORD, TEST_CLIENT_EMAIL / TEST_CLIENT_PASSWORD
#                                   optional real test accounts for the simulator test
# base64 on a Mac:  base64 -i file | pbcopy      on Windows:  certutil -encode file out.txt
# (with certutil, drop the BEGIN/END lines).
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Application'
        type: choice
        options: [les-deux, client, entreprise]
        default: les-deux
      tests:
        description: "Lancer d'abord le test d'intégration sur simulateur iPhone"
        type: boolean
        default: true
      upload:
        description: "Envoyer sur TestFlight (sinon : IPA téléchargeable dans l'onglet Artifacts)"
        type: boolean
        default: true
      build_number:
        description: 'Numéro de build (vide = 56 + numéro du run)'
        type: string
        required: false

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  ios:
    name: ${{ matrix.app }}
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.app == 'les-deux' && '["client","entreprise"]' || format('["{0}"]', inputs.app)) }}
    defaults:
      run:
        working-directory: mobile
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          UPLOAD: ${{ inputs.upload }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_CLIENT_BASE64: ${{ secrets.IOS_PROFILE_CLIENT_BASE64 }}
          IOS_PROFILE_ENTREPRISE_BASE64: ${{ secrets.IOS_PROFILE_ENTREPRISE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=()
          for v in APPLE_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "$APP" = client ]; then [ -n "$IOS_PROFILE_CLIENT_BASE64" ] || missing+=(IOS_PROFILE_CLIENT_BASE64)
          else [ -n "$IOS_PROFILE_ENTREPRISE_BASE64" ] || missing+=(IOS_PROFILE_ENTREPRISE_BASE64); fi
          if [ "$UPLOAD" = true ]; then
            for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do [ -n "${!v}" ] || missing+=("$v"); done
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets GitHub manquants : ${missing[*]}"
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # App Store Connect only accepts builds made with Xcode 26 / the iOS 26
      # SDK or later; fail here with a clear message rather than at upload.
      - name: Vérifier la version de Xcode
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | head -n 1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major sur ce runner ; Apple exige Xcode 26 ou plus. Remplacer runs-on par macos-26."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Variables de l'app (dart-define)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_PRO_EMAIL: ${{ secrets.TEST_PRO_EMAIL }}
          TEST_PRO_PASSWORD: ${{ secrets.TEST_PRO_PASSWORD }}
          TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
          TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD }}
        run: |
          # Build values only: test credentials must never be compiled into the
          # app shipped to TestFlight, so they go in a separate file.
          jq -n --arg u "$SUPABASE_URL" --arg k "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $u, SUPABASE_ANON_KEY: $k}' > "$RUNNER_TEMP/defines.json"
          if [ "$APP" = client ]; then EMAIL="$TEST_CLIENT_EMAIL"; PASSWORD="$TEST_CLIENT_PASSWORD"
          else EMAIL="$TEST_PRO_EMAIL"; PASSWORD="$TEST_PRO_PASSWORD"; fi
          jq --arg e "$EMAIL" --arg p "$PASSWORD" '. + {KOJI_TEST_EMAIL: $e, KOJI_TEST_PASSWORD: $p}' \
            "$RUNNER_TEMP/defines.json" > "$RUNNER_TEMP/test-defines.json"

      - run: flutter pub get

      # Informative, not blocking: simctl cannot pre-grant notifications, so
      # Koji Pro's launch-time permission alert may stall the test on iOS.
      - name: Test d'intégration sur simulateur iPhone
        if: inputs.tests
        continue-on-error: true
        timeout-minutes: 20
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$UDID" ]; then echo "::error::Aucun simulateur iPhone disponible sur ce runner."; exit 1; fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test/app_smoke_test.dart -d "$UDID" \
            --flavor "$APP" --dart-define=KOJI_APP="$APP" \
            --dart-define-from-file="$RUNNER_TEMP/test-defines.json"

      - name: Certificat et profil de distribution
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_CLIENT_BASE64: ${{ secrets.IOS_PROFILE_CLIENT_BASE64 }}
          IOS_PROFILE_ENTREPRISE_BASE64: ${{ secrets.IOS_PROFILE_ENTREPRISE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/koji-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo -n "$IOS_DIST_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

          if [ "$APP" = client ]; then PROFILE_B64="$IOS_PROFILE_CLIENT_BASE64"; BUNDLE_ID=com.koji.client
          else PROFILE_B64="$IOS_PROFILE_ENTREPRISE_BASE64"; BUNDLE_ID=com.koji.pro; fi
          PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          echo -n "$PROFILE_B64" | base64 --decode -o "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          case "$PROFILE_APP_ID" in
            *".$BUNDLE_ID") ;;
            *) echo "::error::Le profil « $PROFILE_NAME » est pour $PROFILE_APP_ID, pas pour $BUNDLE_ID."; exit 1 ;;
          esac
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/$PROFILE_UUID.mobileprovision"
          done

          # Manual signing for the Runner target only (included by
          # ios/Flutter/Release.xcconfig); CocoaPods targets are left alone.
          cat > ios/Flutter/ci-signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $APPLE_TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Construire l'IPA
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: |
          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-$((56 + GITHUB_RUN_NUMBER))}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build ipa --release \
            --flavor "$APP" -t "lib/main_$APP.dart" \
            --build-number "$BUILD_NUMBER" \
            --dart-define-from-file="$RUNNER_TEMP/defines.json" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: koji-${{ matrix.app }}-ipa-${{ env.BUILD_NUMBER }}
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Envoyer sur TestFlight
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Build $BUILD_NUMBER envoyé : il apparaît dans App Store Connect → TestFlight après le traitement Apple (10 à 30 min)."

      - name: Nettoyage des éléments de signature
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f ios/Flutter/ci-signing.xcconfig "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.p12
          rm -rf "$HOME/.appstoreconnect/private_keys"
